<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b08947"/>
      <stop offset="100%" stop-color="#8a6a30"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方框 -->
  <rect width="256" height="256" rx="48" fill="url(#bg)" stroke="#d4c9b8" stroke-width="2"/>

  <!-- 电子轨道 (装饰) -->
  <ellipse cx="128" cy="128" rx="60" ry="24" fill="none" stroke="#d4c9b8" stroke-width="1.5" transform="rotate(-30 128 128)" opacity="0.5"/>
  <ellipse cx="128" cy="128" rx="60" ry="24" fill="none" stroke="#d4c9b8" stroke-width="1.5" transform="rotate(30 128 128)" opacity="0.5"/>

  <!-- 原子核 / 中心圆 -->
  <circle cx="128" cy="128" r="32" fill="url(#accent)" opacity="0.9"/>

  <!-- React 风格原子核结构 -->
  <ellipse cx="128" cy="128" rx="52" ry="16" fill="none" stroke="#b08947" stroke-width="2.5" opacity="0.7"/>
  <ellipse cx="128" cy="128" rx="52" ry="16" fill="none" stroke="#b08947" stroke-width="2.5" transform="rotate(60 128 128)" opacity="0.7"/>
  <ellipse cx="128" cy="128" rx="52" ry="16" fill="none" stroke="#b08947" stroke-width="2.5" transform="rotate(-60 128 128)" opacity="0.7"/>

  <!-- 中心 "E" 字母 -->
  <text x="128" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">E</text>

  <!-- 右上角小圆点 (电子) -->
  <circle cx="180" cy="108" r="5" fill="#b08947"/>
  <circle cx="180" cy="148" r="5" fill="#b08947"/>
  <circle cx="128" cy="180" r="5" fill="#b08947"/>
</svg>